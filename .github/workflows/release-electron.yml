name: Release (Electron)

# Reusable build+release workflow for Electron desktop apps, published via
# electron-builder. Modeled on sweeper's original build.yml, but driven by
# an explicit tagged version instead of auto-versioning off run_number on
# every push to main — callers tag first (see templates/cut-release.yml),
# then call this with that tag.

on:
  workflow_call:
    inputs:
      version:
        description: 'Tag being released, e.g. v1.2.3'
        required: true
        type: string
      node_version:
        required: false
        type: string
        default: '20'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main
        run: npm run build

      - name: Set package version from release tag
        shell: bash
        run: npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
        env:
          VERSION: ${{ inputs.version }}

      - name: Package and publish (${{ matrix.platform }})
        run: npx electron-builder --${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple/Windows signing certs configured — build unsigned artifacts.
          CSC_IDENTITY_AUTO_DISCOVERY: false

  release-notes:
    # electron-builder publishes each matrix leg's assets straight to the
    # release itself (no separate softprops/action-gh-release step to hand
    # a `body` to like the other release-*.yml workflows), so this patches
    # install instructions onto the release electron-builder already
    # created, once every platform has finished uploading its asset.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Add install instructions to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BODY=$(printf '## Installing\n\nDownload the asset for your platform below:\n\n- **Windows** — the `.exe` installer\n- **macOS** — the `.dmg` disk image\n- **Linux** — the `.AppImage` (make it executable first: `chmod +x *.AppImage`)\n\nThese builds are unsigned, so Windows SmartScreen and macOS Gatekeeper will warn about an unrecognized publisher — click through to launch it (right-click → "Open" on macOS the first time).\n')
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/${{ inputs.version }}" --jq .id)
          gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            -f body="$BODY" -F generate_release_notes=true
