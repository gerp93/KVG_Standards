[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kvg-updater"
version = "0.1.0"
description = "Generic GitHub-Releases self-updater for PyInstaller-built desktop apps"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["kvg_updater*"]
