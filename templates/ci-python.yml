# Template: copy to .github/workflows/ci.yml in a uv-managed Python repo with
# no GUI (an MCP server, a CLI, a library). Like templates/ci.yml for Go, it
# needs no local logic: the whole thing runs in KVG_Standards via
# workflow_call. It installs from uv.lock, runs ruff, then pytest.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: gerp93/KVG_Standards/.github/workflows/ci-python.yml@main
    # with:
    #   project_dir: .             # only if pyproject.toml isn't at the repo root
    #   python_version: '3.11'
    #   os: windows-latest         # if the project must also be tested on Windows
